<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Графік зібрання «Бережниця»</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --card-bg: rgba(255, 255, 255, 0.3);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: rgba(241, 245, 249, 0.6);
        }

        /* Робимо фон самої таблиці та її рядків також напівпрозорими */
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.3);
            table-layout: fixed;
        }

        /* Рівне співвідношення колонок 50% на 50% */
        th:nth-child(1), td:nth-child(1) {
            width: 50%;
        }
        th:nth-child(2), td:nth-child(2) {
            width: 50%;
        }

        th {
            background-color: rgba(241, 245, 249, 0.8) !important;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* Напівпрозорі кольорові рядки для гарного вигляду поверх фото */
        .row-green { background-color: rgba(240, 253, 244, 0.8) !important; border-left: 4px solid #22c55e; }
        .row-orange { background-color: rgba(255, 251, 235, 0.8) !important; border-left: 4px solid #f59e0b; }
        .row-red { background-color: rgba(254, 242, 242, 0.8) !important; border-left: 4px solid #ef4444; }
        .row-default { background-color: rgba(255, 255, 255, 0.6) !important; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.6)), 
                        url('https://jwar.fwh.is/zal.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 540px;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }

        h2 {
            color: var(--text-main);
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .select-box {
            margin-bottom: 14px;
        }

        .select-box select {
            width: 100%;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            background-color: #f8fafc;
            color: var(--text-main);
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .select-box select:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        .nav-btn {
            background-color: #fff;
            color: var(--primary);
            border: 1px solid #cbd5e1;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .nav-btn:hover {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .week-badge {
            font-weight: 600;
            font-size: 13.5px;
            color: var(--primary-dark);
            text-align: center;
        }

        .table-wrapper {
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            max-height: 70vh;
            overflow-y: auto;
        }

        th, td {
            padding: 6px 10px;
            text-align: left;
            font-size: 18px;
            border-bottom: 1px solid var(--border-color);
            word-break: break-word;
            overflow-wrap: break-word;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .row-sunday-header { 
            background-color: #f97316 !important; 
            color: white !important; 
            font-weight: bold; 
            text-align: center;
            letter-spacing: 0.5px;
        }

        .empty-cell {
            color: #94a3b8;
            font-style: italic;
            font-weight: 400;
        }

        .loading, .error {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-style: italic;
            font-size: 14px;
        }
        .error { color: #ef4444; }
    </style>
</head>
<body>

<div class="container">
    
    <div class="select-box">
        <select id="weekSelect" onchange="onSelectChange(this.value)">
            <option value="">Завантаження тижнів...</option>
        </select>
    </div>

    <div class="nav-bar">
        <button class="nav-btn" onclick="changeWeek(-1)">← Назад</button>
        <div id="weekTitle" class="week-badge">Поточний тиждень</div>
        <button class="nav-btn" onclick="changeWeek(1)">Вперед →</button>
    </div>

    <div id="content">
        <div class="loading">Завантаження даних...</div>
    </div>
</div>

<script>
    let globalRows = [];
    let weekColumns = []; 
    let currentWeekIndex = 0; 

    function parseWeekDate(dateStr) {
        if (!dateStr) return null;
        let match = dateStr.trim().match(/(\d{1,2})-(\d{1,2})\.(\d{1,2})\.(\d{2}|\d{4})/);
        if (!match) return null;

        let startDay = parseInt(match[1]);
        let endDay = parseInt(match[2]);
        let month = parseInt(match[3]) - 1;
        let rawYear = parseInt(match[4]);
        let year = rawYear < 100 ? 2000 + rawYear : rawYear;

        let startDate = new Date(year, month, startDay);
        let endDate = new Date(year, month, endDay);
        
        if (startDay > endDay) {
            startDate = new Date(year, month - 1, startDay);
        }

        return { start: startDate, end: endDate };
    }

    function getRowStyle(roleText, rowIndex) {
        let text = roleText.toLowerCase();

        if (text.includes('недільне зібрання') || rowIndex === 37) {
            return 'row-sunday-header';
        }

        if (text.includes('молитв') || text.includes('промова') || text.includes('перлини') || text.includes('читання') || text.includes('ведучий')) {
            if (rowIndex > 37 && (text.includes('ведучий') || text.includes('промов'))) {
                return 'row-orange';
            }
            return 'row-green';
        }

        if (text.includes('розмов') || text.includes('крок') || text.includes('приклад') || text.includes('підготовк') || text.includes('переконан') || text.includes('пісня') || text.includes('промовець') || text.includes('промова')) {
            return 'row-orange';
        }

        if (text.includes('християнськ') || text.includes('потреб') || text.includes('вивчення') || text.includes('читець') || text.includes('обслуг') || text.includes('оператор') || text.includes('мікрофон') || text.includes('аудиторія') || text.includes('фоє') || text.includes('відеооператор')) {
            return 'row-red';
        }

        return rowIndex > 37 ? 'row-orange' : 'row-default';
    }

    function renderTable() {
        const contentDiv = document.getElementById('content');
        const weekTitleDiv = document.getElementById('weekTitle');
        const selectElem = document.getElementById('weekSelect');

        if (weekColumns.length === 0) return;

        let currentWeek = weekColumns[currentWeekIndex];
        weekTitleDiv.innerText = currentWeek.name;
        selectElem.value = currentWeekIndex; 

        let html = `
            <div class="table-wrapper">
                <table>
                    <thead>
                        
                    </thead>
                    <tbody>
                        <tr class="row-sunday-header">
                            <td colspan="2" style="text-align: center; font-weight: bold; background-color: #f97316; color: white;">ЗІБРАННЯ СЕРЕД ТИЖНЯ — 18:00</td>
                        </tr>
        `;

        let maxRow = Math.min(globalRows.length, 55);
        for (let i = 2; i < maxRow; i++) {
            let role = globalRows[i] && globalRows[i][0] ? globalRows[i][0] : "";
            if (!role && globalRows[i] && globalRows[i][1] && i === 37) {
                role = globalRows[i][1];
            }

            let person = globalRows[i] && globalRows[i][currentWeek.colIndex] ? globalRows[i][currentWeek.colIndex] : "";

            if (!role && !person) continue;

            let rowClass = getRowStyle(role, i);

            if (rowClass === 'row-sunday-header') {
                html += `
                    <tr class="${rowClass}">
                        <td colspan="2" style="text-align: center; font-weight: bold; background-color: #f97316; color: white;">НЕДІЛЬНЕ ЗІБРАННЯ — 11:00</td>
                    </tr>
                `;
                continue;
            }

            let displayPerson = person !== "" ? person : '<span class="empty-cell">—</span>';
            let displayRole = role !== "" ? `<strong>${role}</strong>` : '<span class="empty-cell">(пусто)</span>';

            html += `
                <tr class="${rowClass}">
                    <td>${displayRole}</td>
                    <td>${displayPerson}</td>
                </tr>
            `;
        }

        html += `</tbody></table></div>`;
        contentDiv.innerHTML = html;
    }

    function changeWeek(direction) {
        let newIndex = currentWeekIndex + direction;
        if (newIndex >= 0 && newIndex < weekColumns.length) {
            currentWeekIndex = newIndex;
            renderTable();
        }
    }

    function onSelectChange(value) {
        currentWeekIndex = parseInt(value);
        renderTable();
    }

    async function loadSchedule() {
        const contentDiv = document.getElementById('content');
        const selectElem = document.getElementById('weekSelect');
        const spreadsheetId = '1QNFA7J1b6K6qeOvcVmJPE_M7GUJRynv-FtyUJ8wEwr0';
        const csvUrl = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/export?format=csv&gid=0`;

        try {
            const response = await fetch(csvUrl);
            const csvText = await response.text();
            
            globalRows = csvText.split('\n').map(row => {
                return row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, '').trim());
            });

            if (globalRows.length === 0) throw new Error("Порожня таблиця");

            const headers = globalRows[0];
            const today = new Date();
            let defaultIndex = -1;

            selectElem.innerHTML = ""; 

            for (let i = 0; i < headers.length; i++) {
                let weekRange = parseWeekDate(headers[i]);
                if (weekRange) {
                    let index = weekColumns.length;
                    weekColumns.push({
                        colIndex: i,
                        name: headers[i],
                        range: weekRange
                    });

                    let option = document.createElement('option');
                    option.value = index;
                    option.text = `Тиждень: ${headers[i]}`;
                    selectElem.appendChild(option);

                    if (today >= weekRange.start && today <= weekRange.end) {
                        defaultIndex = index;
                    }
                }
            }

            if (defaultIndex !== -1) {
                currentWeekIndex = defaultIndex;
            } else if (weekColumns.length > 0) {
                currentWeekIndex = 0;
            }

            renderTable();

        } catch (error) {
            console.error(error);
            contentDiv.innerHTML = `<div class="error">Помилка завантаження даних із таблиці.</div>`;
            document.getElementById('weekTitle').innerText = "Помилка";
        }
    }

    loadSchedule();
</script>

</body>
</html>
